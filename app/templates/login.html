<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Movie Mandala - Login</title>
  <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body>

  <!-- ===== NAVBAR ===== -->
  <nav class="navbar">
    <div class="brand">
      <img src="/static/assets/logo.png" class="navbar-logo" alt ="Movie Mandala logo" />
      <span class="brand-name">Movie Mandala</span>
    </div>
    <div class="nav-links">
      <a href="/result">Home</a>
      <a href="/about">About Us</a>
      <a href="/signup" class="btn-nav">Sign Up</a>
    </div>
  </nav>

  <!-- ===== LOGIN PAGE ===== -->
  <div class="auth-bg">
    <div class="auth-card">

      <div class="auth-logo">
        <img src="/static/assets/logo.png" class="auth-logo-img" alt="Movie Mandala logo" />
        <h2>Login</h2>
        
      </div>

      <div class="form-group">
        <label>Email</label>
        <input type="email" placeholder="Enter your email" />
      </div>

      <div class="form-group">
        <label>Password</label>
        <input type="password" placeholder="Enter your password" />
      </div>

      <p class="forgot">Forgot password?</p>

      <button class="btn-primary" onclick="window.location.href='/result'">
        Login
      </button>

      <div class="divider">or</div>

      <button class="btn-google">
        🌐 Continue with Google
      </button>

      <p class="switch-link">
        Don't have an account?
        <a href="/signup">Sign Up</a>
      </p>

    </div>
  </div>

  <script src="/static/js/app.js"></script>

</body>
</html>
