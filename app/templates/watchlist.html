<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Watchlist</title>

<link rel="stylesheet" href="/static/css/style.css">
<link rel="stylesheet" href="/static/css/home.css">

<style>
body{
    background:#050505;
    color:white;
}

.container{
    max-width:1200px;
    margin:auto;
    padding:40px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
    gap:25px;
}

.card{
    background:#181818;
    border-radius:15px;
    overflow:hidden;
    transition:all .35s ease;
}

.card:hover{
    transform:translateY(-8px);
    box-shadow:0 15px 30px rgba(229,9,20,.35);
}

.card img{
    width:100%;
    height:320px;
    object-fit:cover;
    border-radius:15px 15px 0 0;
    transition:.4s;
}
.card:hover img{

    transform:scale(1.05);

}
.card-body{
    padding:15px;
}

.card button{
    width:100%;
    margin-top:10px;
    background:#e50914;
    color:white;
    border:none;
    padding:10px;
    cursor:pointer;
    border-radius:8px;
    transition:.3s;
}

.card button:hover{

    background:#b20710;

    transform:scale(1.05);

}

/* Modal Background */

.modal{

    display:none;

    position:fixed;

    top:0;
    left:0;

    width:100%;
    height:100%;

    background:rgba(0,0,0,.75);

    justify-content:center;

    align-items:center;

    z-index:9999;

}

/* Modal Box */

.modal-content{

    background:#181818;

    padding:30px;

    border-radius:20px;

    width:400px;

    text-align:center;

    box-shadow:0 15px 40px rgba(0,0,0,.6);

}

.modal-content h2{

    color:white;

    margin-bottom:15px;

}

.modal-content p{

    color:#bbb;

    margin-bottom:25px;

}

/* Buttons */

.modal-buttons{

    display:flex;

    justify-content:center;

    gap:15px;

}

.cancel-btn{

    background:#444;

    color:white;

    border:none;

    padding:10px 20px;

    border-radius:8px;

    cursor:pointer;

}

.remove-btn{

    background:#e50914;

    color:white;

    border:none;

    padding:10px 20px;

    border-radius:8px;

    cursor:pointer;

}

.cancel-btn:hover{

    background:#666;

}

.remove-btn:hover{

    background:#b20710;

}
</style>

</head>

<body>

<nav class="navbar">

<div class="brand">
<img src="/static/assets/logo.png" class="navbar-logo">
<span class="brand-name">Movie Mandala</span>
</div>

<div class="nav-links">
<a href="/result">Home</a>
<a href="/about">About Us</a>
</div>

</nav>

<div class="container">

<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:30px;">

    <div>

        <h1 id="watchlistTitle">❤️ My Watchlist</h1>

        <p style="color:#999;margin-top:5px;">
            Your favorite movies in one place
        </p>

    </div>

</div>

<div id="watchlist" class="grid">

<div style="grid-column:1/-1;text-align:center;padding:80px;">

<h2>Loading your watchlist...</h2>

</div>

</div>
</div>
<!-- Remove Confirmation Modal -->

<div id="deleteModal" class="modal">

    <div class="modal-content">

        <h2>Remove Movie?</h2>

        <p>Are you sure you want to remove this movie from your watchlist?</p>

        <div class="modal-buttons">

            <button class="cancel-btn" onclick="closeModal()">
                Cancel
            </button>

            <button class="remove-btn" onclick="confirmRemove()">
                Remove
            </button>

        </div>

    </div>

</div>
<script>
let movieToDelete = null;
async function loadWatchlist(){

const token = localStorage.getItem("token");

const response = await fetch("/watchlist/",{

headers:{
Authorization:`Bearer ${token}`
}

});

const movies = await response.json();

document.getElementById("watchlistTitle").innerHTML =
`❤️ My Watchlist (${movies.length})`;

if(movies.length===0){

document.getElementById("watchlist").innerHTML=`

<div style="grid-column:1/-1;text-align:center;padding:80px;">

<h2>❤️ Your watchlist is empty</h2>

<p>Add movies from the Home page.</p>

<button
onclick="window.location.href='/result'"
style="
background:#e50914;
color:white;
border:none;
padding:12px 25px;
border-radius:8px;
cursor:pointer;">

Explore Movies

</button>

</div>

`;

return;

}

let html="";

movies.forEach(movie=>{

html +=`

<div class="card"
     onclick="openMovie(${movie.movie_id})"
     style="cursor:pointer;">

<img
    src="${movie.poster_url}"
    alt="${movie.title}"
    loading="lazy"
    onerror="this.src='/static/assets/no-poster.png'">

<div class="card-body">

<h3 style="margin-bottom:8px;">
${movie.title}
</h3>

<div style="display:flex;justify-content:space-between;color:#bbb;font-size:14px;">

<span>⭐ ${movie.vote_average}</span>

<span>📅 ${movie.release_date ? movie.release_date.substring(0,4) : "N/A"}</span>

</div>
<button onclick="event.stopPropagation(); removeMovie(${movie.movie_id})">
    🗑 Remove
</button>


</div>

</div>

`;

});

document.getElementById("watchlist").innerHTML = html;

}
function openMovie(movieId){

window.location.href = `/movie?movie_id=${movieId}`;

}
function closeModal(){

    document.getElementById("deleteModal").style.display = "none";

    movieToDelete = null;

}

async function confirmRemove(){

    const token = localStorage.getItem("token");

    await fetch(`/watchlist/${movieToDelete}`,{

        method:"DELETE",

        headers:{
            Authorization:`Bearer ${token}`
        }

    });

    closeModal();

    loadWatchlist();

}
function removeMovie(movieId){

    movieToDelete = movieId;

    document.getElementById("deleteModal").style.display = "flex";

}

loadWatchlist();

</script>

</body>
</html>
