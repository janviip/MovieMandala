<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Movie Mandala - Home</title>
<link rel="stylesheet" href="/static/css/style.css" />
<link rel="stylesheet" href="/static/css/home.css" />
<style>
body{
    background:#0f0f0f;
    color:white;
}
/* HERO */
.hero{
    text-align:center;
    padding:60px 20px;
}
.search-wrap{
    margin-top:25px;
}
#searchInput{

    width:350px;
    padding:14px 20px;
    border-radius:30px;
    border:none;
    outline:none;
    font-size:16px;

}
.search-wrap button{

    padding:14px 28px;
    margin-left:10px;
    border-radius:30px;
    border:none;
    cursor:pointer;

}
/* MOVIE SECTION */
.genre-section{

    padding:30px;

}
.genre-title{

    font-size:26px;
    font-weight:bold;
    margin-bottom:25px;

}
.cards-row{

    display:flex;
    gap:25px;
    overflow-x:auto;
    padding-bottom:20px;

}
/* MOVIE CARD */
.movie-card{

    min-width:180px;
    background:#1b1b1b;
    border-radius:15px;
    overflow:hidden;
    transition:0.3s;

}
.movie-card:hover{

    transform:translateY(-8px);

}
.movie-poster{

    width:180px;
    height:260px;
    object-fit:cover;

}
.movie-info{

    padding:12px;

}
.movie-title{

    font-size:16px;
    font-weight:bold;

}
.movie-details{

    margin-top:8px;
    font-size:14px;
    color:#cccccc;
}
.message{

    color:#aaa;
    font-size:18px;

}
</style>
</head>
<body>
<!-- NAVBAR -->
<nav class="navbar">
<div class="brand">
<img 
src="/static/assets/logo.png"
class="navbar-logo"
alt="Movie Mandala Logo">
<span class="brand-name">
Movie Mandala
</span>
</div>
<div class="nav-links">
<a href="/result">
Home
</a>
<a href="/about">
About Us
</a>
<button 
class="btn-signin"
onclick="window.location.href='/login'">
Sign In
</button>
</div>
</nav>
<!-- HERO -->
<section class="hero">
<h1>
Find movies you'll <span>love</span>
</h1>


<p>
Search a movie and discover similar movies.
</p>
<div class="search-wrap">


<input

type="text"

id="searchInput"

placeholder="Try Avatar, Titanic, Inception..."

>
<button onclick="searchMovies()">

Search

</button>
</div>
</section>

<!-- TRENDING MOVIES -->

<section class="genre-section">

<div class="genre-title">
🔥 Trending Movies
</div>


<div 
class="cards-row"
id="trendingMovies">

</div>


</section>

<!-- POPULAR MOVIES -->

<section class="genre-section">

<div class="genre-title">
⭐ Popular Movies
</div>

<div 
class="cards-row"
id="popularMovies">

</div>

</section>

<!-- RESULTS -->
<section 
class="genre-section"
id="resultSection"
style="display:none;">
<div class="genre-title">

Results for:
<span id="searchName"></span>

</div>
<div 
class="cards-row"
id="movieContainer">
</div>
</section>
<script>
const API_URL = "http://127.0.0.1:8000";
function createMovieCard(movie){


let poster = movie.poster_url;


if(!poster){

poster =
"https://via.placeholder.com/180x260?text=No+Poster";

}
return `
<div class="movie-card">
<img

src="${poster}"

class="movie-poster"

alt="${movie.title}"

onerror="this.src='https://via.placeholder.com/180x260?text=No+Poster'"

>
<div class="movie-info">
<div class="movie-title">
${movie.title}
</div>
<div class="movie-details">
📅 ${movie.release_date || "Unknown"}
<br>
⭐ ${movie.vote_average || "N/A"}
</div>
</div>
</div>
`;
}
async function searchMovies(){
const searchValue =
document
.getElementById("searchInput")
.value
.trim();
if(searchValue===""){
alert("Please enter movie name");
return;
}
const token =
localStorage.getItem("token");
if(!token){
alert("Please login first");
window.location.href="/login";
return;
}
const container =
document.getElementById("movieContainer");
document
.getElementById("resultSection")
.style.display="block";
document
.getElementById("searchName")
.textContent =
searchValue;
container.innerHTML =
`
<p class="message">
Loading movies...
</p>
`;
try{
const response =
await fetch(

`${API_URL}/movies?search=${encodeURIComponent(searchValue)}`,
{
method:"GET",
headers:{

"Authorization":
`Bearer ${token}`,
"accept":
"application/json"

}
}
);
if(response.status===401){
alert("Session expired. Please login again.");
localStorage.removeItem("token");
window.location.href="/login";
return;
}
if(!response.ok){
throw new Error("Movie fetch failed");
}
const movies =
await response.json();
if(movies.length===0){
container.innerHTML=
`
<p class="message">
No movies found.
</p>
`;
return;
}
container.innerHTML =
movies
.map(createMovieCard)
.join("");
}
catch(error){
console.error(error);
container.innerHTML=
`
<p class="message">
Unable to load movies.
</p>
`;
}
}
document
.getElementById("searchInput")
.addEventListener(
"keypress",
function(event){
if(event.key==="Enter"){
searchMovies();
}
}
);

async function loadTrendingMovies(){


const token = localStorage.getItem("token");


if(!token){
    return;
}


const movieNames = [
    "Avatar",
    "Titanic",
    "Inception",
    "Interstellar",
    "Avengers",
    "The Dark Knight",
    "Spider-Man",
    "Dune",
    "Joker",
    "Oppenheimer"
];


async function loadPopularMovies(){


const token = localStorage.getItem("token");


if(!token){
    return;
}



const movieNames = [

    "Avatar",
    "Inception",
    "Titanic",
    "Avengers",
    "Interstellar",
    "Joker",
    "Dune"

];



let popularMovies = [];



for(let movie of movieNames){


    const response = await fetch(

        `${API_URL}/movies?search=${movie}`,

        {

        headers:{
            "Authorization":`Bearer ${token}`
        }

        }

    );



    const data = await response.json();



    if(data.length > 0){

        popularMovies.push(data[0]);

    }


}




document.getElementById("popularMovies").innerHTML =

popularMovies
.map(createMovieCard)
.join("");



}

let allMovies = [];



for(let movie of movieNames){


    const response = await fetch(
        `${API_URL}/movies?search=${movie}`,
        {

        headers:{
            "Authorization":`Bearer ${token}`
        }

        }
    );


    const data = await response.json();


    if(data.length > 0){

        allMovies.push(data[0]);

    }

}
document.getElementById("trendingMovies")
.innerHTML =
allMovies
.map(createMovieCard)
.join("");
}
loadTrendingMovies();
loadPopularMovies();
</script>
</body>
</html>
